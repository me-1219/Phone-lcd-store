name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./server/
          server-dir: ${{ secrets.BACKEND_SERVER_DIR }}
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-main.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/node_modules/**
            node_modules/**

      - name: Prepare restart signal
        run: |
          mkdir -p tmp_restart/tmp
          date > tmp_restart/tmp/restart.txt

      - name: Trigger Passenger restart
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./tmp_restart/
          server-dir: ${{ secrets.BACKEND_SERVER_DIR }}
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-restart.json